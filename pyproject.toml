[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alua-ai"
version = "0.3.0"
description = "Standalone cognitive runtime for AluaWorld via AluaBridge"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "HrajemeSpolu11-star"}]
dependencies = []

[project.scripts]
alua = "alua.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
